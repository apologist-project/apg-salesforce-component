<template>
  <lightning-card>
    <div slot="title" class="slds-media slds-media_center slds-truncate">
      <div class="slds-media__figure">
        <lightning-icon
          icon-name={resolvedCardIcon}
          size="small"
          alternative-text={resolvedCardTitle}
          style={iconBackgroundStyle}
        ></lightning-icon>
      </div>
      <div class="slds-media__body slds-truncate">
        <span class="slds-text-heading_small">{resolvedCardTitle}</span>
      </div>
    </div>
    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
      <p class="slds-text-body_small slds-m-bottom_small">{resolvedCardDescription}</p>
      <lightning-button
        variant="brand"
        label={buttonLabel}
        title={buttonLabel}
        disabled={isBusy}
        style={buttonColorStyle}
        onclick={handleGenerate}
      ></lightning-button>

      <template lwc:if={errorMessage}>
        <div
          class="slds-text-color_error slds-m-top_small slds-text-body_small"
          role="alert"
        >
          {errorMessage}
        </div>
      </template>

      <template lwc:if={draftText}>
        <div class="review slds-m-top_small">
          <template lwc:if={sourceBody}>
            <div class="slds-form-element">
              <span class="slds-form-element__label">Constituent's email</span>
              <div class="slds-form-element__control">
                <template lwc:if={sourceSubject}>
                  <div class="slds-text-body_small slds-m-bottom_xx-small">{sourceSubject}</div>
                </template>
                <div class="source__body slds-box slds-box_x-small slds-theme_shade">{sourceBody}</div>
              </div>
            </div>
          </template>
          <div>
            <lightning-textarea
              class="draft-input"
              label="Generated Draft Reply"
              value={draftText}
              data-id="draft"
            ></lightning-textarea>
            <lightning-button
              class="slds-m-top_x-small"
              variant="neutral"
              label="Open in Send Email"
              title="Open Send Email with this draft"
              disabled={isBusy}
              onclick={handleOpenComposer}
            ></lightning-button>
          </div>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
